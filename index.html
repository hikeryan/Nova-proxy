
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Proxy</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080e1c;color:white;
 font-family:Arial,sans-serif;text-align:center;
 padding:40px 18px;
}
h1{font-size:42px;color:#60a5fa}
p{color:#94a3b8}
main{max-width:650px;margin:auto}
input{
 width:100%;padding:16px;border-radius:12px;
 background:#172236;color:white;
 border:1px solid #334155;font-size:16px
}
button{
 padding:14px 22px;margin:10px;
 background:#2563eb;color:white;
 border:0;border-radius:10px;cursor:pointer
}
.cards{
 display:grid;grid-template-columns:1fr 1fr;
 gap:14px;margin-top:30px
}
.card{background:#172236;padding:22px;border-radius:15px}
a{color:#93c5fd;text-decoration:none}
</style>
</head>
<body>
<main>
<h1>✦ NOVA PROXY</h1>
<p>YOUR WEB. YOUR UNIVERSE.</p>
<form id="search">
<input id="q" placeholder="Search the web..." required>
<button>Search</button>
</form>
<div class="cards">
<div class="card">
<h2>🔎 Search</h2>
<p>Explore the internet</p>
<a href="https://www.google.com">Open search</a>
</div>
<div class="card">
<h2>🎮 Games</h2>
<p>Play browser games</p>
<a href="https://play2048.co">Play 2048</a>
</div>
</div>
</main>
<script>
document.getElementById("search").onsubmit=e=>{
 e.preventDefault();
 const q=document.getElementById("q").value.trim();
 if(q) location.href="https://www.google.com/search?q="+encodeURIComponent(q);
};
</script>
</body>
</html>
